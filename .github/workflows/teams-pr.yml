name: Post PRs to Teams

on:
  pull_request:
    types:
      - ready_for_review

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notify
        uses: davidwengier/PostAdaptiveCard@ed077f2bd4b80fdaaef21dae2e13a34e556d466d # v1.0.4
        with:
          webhook_uri: ${{ secrets.TEAMS_PR_WEBHOOK }}
